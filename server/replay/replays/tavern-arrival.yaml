messages:
  - I push the door shut behind me against the wind and shake the rain from my cloak. "Is the kitchen still open, or only the bar?"
  - I cross to the bar, take the stool nearest the fire and set a silver coin on the counter. "Something hot, then. And a room for the night."
  - I nod at the letter by his hand. "Bad news travels fast on a night like this. Who's it from?"
  - I lean back and wait, watching the rain run down the window, saying nothing.
