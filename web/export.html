<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1" />
    <title>Compare Image Models</title>
    <script>
      // As index.html's: the theme chosen in this browser (ThemeToggle), or the system's, applied
      // before first paint so the page never flashes the wrong one.
      try {
        const saved = localStorage.getItem('theme')
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        document.documentElement.classList.toggle(
          'dark',
          matchMedia('(prefers-color-scheme: dark)').matches,
        )
      }
    </script>
  </head>
  <body class="h-full bg-canvas text-fg">
    <div id="app" class="h-full"></div>
    <!-- The server puts the Comparison here as JSON when it exports (server/export/). -->
    <script id="comparison" type="application/json">{}</script>
    <script type="module" src="/src/export/main.ts"></script>
  </body>
</html>
